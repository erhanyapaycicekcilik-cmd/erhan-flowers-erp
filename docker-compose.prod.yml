services:
  postgres:
    image: postgres:16-alpine
    container_name: erhan-flowers-postgres-prod
    restart: unless-stopped
    networks:
      - erp_net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erhanflowers}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-erhan_flowers_panel}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data

  backend:
    image: ghcr.io/erhanyapaycicekcilik-cmd/erhan-flowers-backend:latest
    container_name: erhan-flowers-backend-prod
    restart: unless-stopped
    networks:
      - erp_net
    env_file:
      - ./backend/.env.production
    depends_on:
      - postgres
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-erhanflowers}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-erhan_flowers_panel}?schema=public"
      PRODUCT_IMAGE_ROOT: "/data/urun-gorseller"
      STOCK_IMAGE_ROOT: "/data/stok-gorseller"
    volumes:
      - backend_uploads:/app/uploads
      - /data/urun-gorseller:/data/urun-gorseller
      - /data/stok-gorseller:/data/stok-gorseller
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/auth/health || exit 0"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

  frontend:
    image: ghcr.io/erhanyapaycicekcilik-cmd/erhan-flowers-frontend:latest
    container_name: erhan-flowers-frontend-prod
    restart: unless-stopped
    networks:
      - erp_net
    env_file:
      - ./frontend/.env.production
    depends_on:
      backend:
        condition: service_healthy

  florayapay:
    image: ghcr.io/erhanyapaycicekcilik-cmd/erhan-flowers-florayapay:latest
    container_name: erhan-flowers-florayapay-prod
    restart: unless-stopped
    networks:
      - erp_net
    environment:
      ADMIN_PASSWORD: ${FLORAYAPAY_ADMIN_PASSWORD:-erhan2024}
      SITE_URL: ${SITE_URL:-https://www.erhanflowers.com}
      NEXT_PUBLIC_APP_URL: ${SITE_URL:-https://www.erhanflowers.com}
      NEXT_PUBLIC_API_URL: ${API_URL:-https://api.erhanflowers.com}
      NEXT_PUBLIC_INSTAGRAM_HANDLE: ${INSTAGRAM_HANDLE:-erhanflowers}
      INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_ACCESS_TOKEN:-}
      NEXT_PUBLIC_GTM_ID: ${GTM_ID:-}
      NEXT_PUBLIC_GA_ID: ${GA_ID:-}
      # EFT / Havale banka bilgileri
      IBAN_BANKA: ${IBAN_BANKA:-Yapı Kredi Bankası}
      IBAN_NO: ${IBAN_NO:-}
      IBAN_HESAP_SAHIBI: ${IBAN_HESAP_SAHIBI:-ERHAN FLOWERS ÇİÇEKÇİLİK ELEKTRONİK TİCARET VE SANAYİ LİMİTED ŞİRKETİ}
      IBAN_SWIFT: ${IBAN_SWIFT:-}
      # Online ödeme — iyzico (boş bırakılırsa kart ödeme seçeneği gizlenir)
      IYZICO_API_KEY: ${IYZICO_API_KEY:-}
      IYZICO_SECRET_KEY: ${IYZICO_SECRET_KEY:-}
      IYZICO_BASE_URL: ${IYZICO_BASE_URL:-https://api.iyzipay.com}
    volumes:
      - florayapay_banner:/app/data

  caddy:
    image: caddy:2-alpine
    container_name: erhan-flowers-caddy-prod
    restart: always
    networks:
      - erp_net
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
      - florayapay

networks:
  erp_net:
    name: erp_net

volumes:
  postgres_prod_data:
  backend_uploads:
  florayapay_banner:
  caddy_data:
  caddy_config:
