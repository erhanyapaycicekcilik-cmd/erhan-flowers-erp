name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 20m
          script: |
            if [ ! -d /opt/erp ]; then
              git clone https://${{ secrets.GH_TOKEN }}@github.com/erhanyapaycicekcilik-cmd/erhan-flowers-erp.git /opt/erp
            fi
            cd /opt/erp
            git fetch https://${{ secrets.GH_TOKEN }}@github.com/erhanyapaycicekcilik-cmd/erhan-flowers-erp.git main
            git reset --hard FETCH_HEAD
            echo "=== Son commit ==="
            git log --oneline -3
            echo "=== Eski imajlar siliniyor ==="
            docker compose -f docker-compose.prod.yml down --rmi local 2>/dev/null || true
            echo "=== Build basliyor ==="
            docker compose -f docker-compose.prod.yml build backend frontend florayapay
            echo "=== Containerlar baslatiliyor ==="
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
            echo "=== Deploy tamamlandi ==="
