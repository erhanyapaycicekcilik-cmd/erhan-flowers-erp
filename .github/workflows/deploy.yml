name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 30m
          request_pty: true
          script: |
            set -e
            export DOCKER_BUILDKIT=0
            export COMPOSE_DOCKER_CLI_BUILD=0

            if [ ! -d /opt/erp ]; then
              git clone https://${{ secrets.GH_TOKEN }}@github.com/erhanyapaycicekcilik-cmd/erhan-flowers-erp.git /opt/erp
            fi
            cd /opt/erp
            git fetch https://${{ secrets.GH_TOKEN }}@github.com/erhanyapaycicekcilik-cmd/erhan-flowers-erp.git main
            git reset --hard FETCH_HEAD
            echo "=== Son commit ==="
            git log --oneline -3

            echo "=== RAM ve disk ==="
            free -h
            df -h /

            echo "=== Swap olusturuluyor (2GB) ==="
            if ! swapon --show | grep -q swapfile; then
              fallocate -l 2G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=2048
              chmod 600 /swapfile
              mkswap /swapfile
              swapon /swapfile
            fi
            free -h

            echo "=== Backend build ==="
            docker compose -f docker-compose.prod.yml build --no-cache --progress=plain backend
            echo "Backend OK"

            echo "=== Frontend build ==="
            docker compose -f docker-compose.prod.yml build --no-cache --progress=plain frontend
            echo "Frontend OK"

            echo "=== Florayapay build ==="
            docker compose -f docker-compose.prod.yml build --no-cache --progress=plain florayapay
            echo "Florayapay OK"

            echo "=== Containerlar baslatiliyor ==="
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
            echo "=== Deploy tamamlandi ==="
