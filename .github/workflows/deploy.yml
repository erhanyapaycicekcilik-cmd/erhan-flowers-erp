name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 77.42.122.169
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd /opt/erp
            git pull origin main
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f
