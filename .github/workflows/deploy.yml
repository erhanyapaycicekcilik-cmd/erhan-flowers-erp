name: Deploy to Production

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/erhanyapaycicekcilik-cmd/erhan-flowers-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/erhanyapaycicekcilik-cmd/erhan-flowers-frontend:latest

      - name: Build and push florayapay
        uses: docker/build-push-action@v5
        with:
          context: ./florayapay
          push: true
          tags: ghcr.io/erhanyapaycicekcilik-cmd/erhan-flowers-florayapay:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 10m
          request_pty: true
          script: |
            set -e
            if [ ! -d /opt/erp ]; then
              git clone https://${{ secrets.GH_TOKEN }}@github.com/erhanyapaycicekcilik-cmd/erhan-flowers-erp.git /opt/erp
            fi
            cd /opt/erp
            git fetch https://${{ secrets.GH_TOKEN }}@github.com/erhanyapaycicekcilik-cmd/erhan-flowers-erp.git main
            git reset --hard FETCH_HEAD
            echo "=== Son commit ==="
            git log --oneline -3
            echo "=== GHCR login ==="
            echo "${{ secrets.GH_TOKEN }}" | docker login ghcr.io -u erhanyapaycicekcilik-cmd --password-stdin
            echo "=== Yeni imajlar pull ediliyor ==="
            docker compose -f docker-compose.prod.yml pull backend frontend florayapay
            echo "=== Containerlar baslatiliyor ==="
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
            echo "=== Deploy tamamlandi ==="
